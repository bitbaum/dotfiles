# GOLDEN CI FLOOR — npm repos. See templates/ci/README.md.
# Copy to .github/workflows/ci.yml and adjust step commands to the repo's scripts.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push makes the older run obsolete — don't waste minutes finishing it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        # Use the repo's `type-check`/`typecheck` script if it has one, else tsc.
        run: npm run type-check --if-present && npx tsc --noEmit

      - name: Test
        # The suite you already wrote — now it actually runs on every PR.
        run: npm run test

      - name: Build
        # Hermetic compile: proves the shipped artifact builds. Placeholder DB
        # URL covers tools that read the var without connecting.
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
        run: npm run build
